name: Sync Fork with Upstream

on:
  schedule:
    - cron: "0 8 * * *" # 매일 아침 8시
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/openequella/openEQUELLA.git
          git fetch upstream

      - name: Merge upstream changes
        run: |
          git merge upstream/develop -m "Sync upstream"
          git push origin develop
